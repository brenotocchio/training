<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executando vídeos</title>
</head>
<body>

    <h1>Executando vídeos</h1>

    <!-- 
    source -> fonte
    controls -> controles
    muted -> mutado
    autoplay -> Reprodução automática
    loop -> ciclo
    poster -> cartaz
    -->

    <video width="500" controls poster="imagens/item1.jpeg">
        <source src="videos/abelhas.mp4" type="video/mp4">
        Seu navegador não suporta a execução desse vídeo!
    </video>
    
</body>
</html>
