<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de formulários</title>
</head>
<body>

    <h1>Exercício de formulários</h1>

    <form action="" method="GET">

    <fieldset>
        <legend>Dados pessoais</legend>

        <label for="nome">Nome</label><br>
        <input type="text" name="nome" id="nome"><br>

        <label for="email">Email</label><br>
        <input type="text" name="email" id="email"><br>

        <label><input type="checkbox">Quero receber e-mail</label><br><br>

        <label for="senha">Senha</label><br>
        <input type="password" name="senha" id="senha">
        
    </fieldset>

    <fieldset>
        <legend>Informações adicionais</legend>

        <label><input type="radio" name="radio">Pessoa física</label>
        <label><input type="radio" name="radio">Pessoa Jurídica</label>

    </fieldset>
    
    <br>
    <input type="submit" value="Cadastrar">

    </form>
    
</body>
</html>
