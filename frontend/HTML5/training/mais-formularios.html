<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mais formulários</title>
</head>
<body>

    <h1>Mais sobre formulários</h1>
    <form action="processa.html" method="GET">

        <h2>Label</h2>
        <!-- 
        label -> legenda para item da interface
        for -> para
        -->

        <label>
            Nome:
            <input type="text" nome="name">
        </label>

        <label for="email">Email</label>
        <input type="text" name="email" id="email">

        <br>

        <h2>Mais elementos de formulários</h2>

        Gênero <br>
        <input type="radio" name="genero" id="feminino">
        <label for="feminino">Feminino</label>

        <input type="radio" name="genero" id="masculino">
        <label for="masculino">Masculino</label>
        <br><br>

        Estilo musical <br>
        <input type="checkbox" name="estilo" value="rock" id="rock">
        <label for="rock">Rock</label>

        <input type="checkbox" name="estilo" value="pop" id="pop">
        <label for="pop">Pop</label>

        <input type="checkbox" name="estilo" value="sertanejo" id="sertanejo">
        <label for="sertanejo">Sertanejo</label>
        <br><br>

        Estado:
        <select name="estado" id="">
            <option value="">Selecione</option>
            <option value="sp">São Paulo</option>
            <option value="rj">Rio de Janeiro</option>
            <option value="ce">Ceará</option>
            <option value="mg">Minas Gerais</option>
        </select>
        <br><br>

        Upload de arquivo: <br>
        <input type="file" name="arquivo">

        <br><br>
        <input type="submit" value="cadastrar">

    </form>

    <form action="">

        <h2>Fieldset & Legend</h2>
        <!-- 
            fieldset -> Conjunto de campos
            legend -> legenda para conjunto de campos
        -->
        
        <fieldset>
            <legend>Dados pessoais</legend>

            <label>
                Nome:
                <input type="text" nome="name">
            </label>

            <label for="email2">Email</label>
            <input type="text" name="email" id="email2">

        </fieldset>

    </form>
    
</body>
</html>
