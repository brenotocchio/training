<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classe e Pseudo-elemento</title>

    <style>

        /* Pseudo Classe
        a:hover {
            background-color: purple;
            color: white;
        }
        */

        /* Links não visitados
        a:link {
            color: grey;
        }
        
        */

        /* links */
        a, a:link{
            text-decoration: none;
            color: green;
            padding: 0.5em 1em;
        }

        a:hover {
            background-color: green;
            color: white;
      }

    </style>

</head>
<body>

    <div>
        Conteúdo da div
    </div>

    <h2>Conteúdo do h2</h2>

    <a href="">Google</a> |
    <a href="">Facebook</a> |
    <a href="">Instagram</a>
    
</body>
</html>
